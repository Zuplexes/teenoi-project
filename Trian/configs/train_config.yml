# ค่าทั้งหมดที่ train.py ใช้ (รัน: python train.py)

seed: 71                              # ล็อก random ให้เทรนซ้ำได้ผลใกล้เดิม

# ---- โหมดรัน ----
resume: false                         # false = เทรนใหม่ตั้งแต่ต้น | true = เทรนต่อจาก checkpoint ล่าสุดใน output_dir | "models/.../checkpoint-500" = ระบุเอง
eval_only: false                      # true = ไม่เทรน โหลด <output_dir>/<model.name>/best มาวัดบน test แล้วสร้างรายงาน/กราฟใหม่

# ---- โฟลเดอร์ ----
data_dir: data/final                  # ข้อมูลที่ได้จาก split.py (train.csv, val.csv, test.csv, split_info.json)
output_dir: models/teenoi_4           # ที่เก็บโมเดล -> models/teenoi_4/<ชื่อโมเดล>/best (เปลี่ยนชื่อทุกรอบ ไม่ให้ทับรอบเก่า)
report_dir: reports/teenoi_4          # ที่เก็บรายงานและกราฟ -> reports/teenoi_4/<ชื่อโมเดล>/

# ---- โมเดล ----
model:
  name: xlm-roberta-base              # โมเดลฐานจาก Hugging Face (ดาวน์โหลดอัตโนมัติครั้งแรก)
  max_length: 256                     # จำนวน token สูงสุดต่อแถว ยาวกว่านี้ตัดท้ายรีวิว (รีวิว 95% ยาวไม่เกิน ~390 ตัวอักษร)

# ---- การเทรน ----
training:
  learning_rate: 1.0e-5               # ความเร็วการเรียนรู้ สูงไป = ไม่เสถียร ต่ำไป = เรียนช้า
  batch_size: 8                       # จำนวนแถวต่อ batch (GPU 6GB รับได้ประมาณนี้)
  grad_accum_steps: 4                 # สะสม gradient 4 batch ก่อนอัปเดต -> effective batch = 8 x 4 = 32
  epochs: 20                          # จำนวนรอบสูงสุด (มักหยุดก่อนด้วย early stopping)
  warmup_ratio: 0.1                   # 10% ของ step แรก ค่อยๆ เพิ่ม learning rate จาก 0 ช่วยให้เริ่มเทรนเสถียร
  weight_decay: 0.01                  # ลดขนาดน้ำหนักโมเดลเล็กน้อย กัน overfit
  fp16: true                          # ใช้ตัวเลข 16 บิต เร็วขึ้นและกินหน่วยความจำ GPU น้อยลง (ไม่มี GPU = ปิดเอง)
  early_stopping_patience: 5          # F1 macro บน val ไม่ดีขึ้น 5 epoch ติด -> หยุดเทรน
  use_class_weights: true             # ให้ label ที่มีน้อย (neutral) มีน้ำหนักใน loss มากขึ้น none มีมากที่สุดได้น้ำหนักน้อย
  class_weight_power: 0.5             # 1 = ตามสัดส่วนเต็ม (neutral ~10) | 0.5 = รากที่สอง (neutral ~3) ลดการจำ neutral ไม่กี่แถวจนเกินไป
  label_smoothing: 0.1                # 0 = ปิด | 0.1 = ไม่เชื่อ label 100% ช่วยเมื่อ label neutral/negative ไม่สม่ำเสมอ
