# API key ไม่ใส่ในไฟล์นี้ (repo เป็น public) ให้ใส่ในไฟล์ .env ที่ root ของ repo (อยู่ใน .gitignore):
#   LABEL_STUDIO_API_KEY=<key จาก Label Studio -> Account & Settings -> Access Token>

url: http://26.234.195.56:8080             # ที่อยู่ server (ไม่ต้องมี /user/login/)
project_title: teenoi-data                 # ชื่อโปรเจกต์ ถ้ายังไม่มีจะสร้างให้พร้อม label_config
label_config: labelstudio_config.xml        # Labeling Interface ที่ใช้ตอนสร้างโปรเจกต์ใหม่
files:                                      # ไฟล์ CSV ที่จะ upload (ต้องมีคอลัมน์ review_id, review)
  - data/clean/reviews_clean.csv
